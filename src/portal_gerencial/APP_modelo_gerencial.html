<title>Portal Gerencial · Rede Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Portal Gerencial — mesmos tokens do portal da loja (tema claro único, fundo gelo).
   Layout: barra fixa com marca, abas e filtros; uma tela por aba em coluna de até 1240px. */
:root {
  --bg: #FAF6F7; --card: #FFFFFF; --tint: #FBE9EE; --borda: #F3DDE3;
  --ink: #2E0E17; --titulo: #5C1A2B; --acento: #A3284D; --suave: #6E4A54; --nota: #7A5562; --grade: #F3DDE3;
  --c-balcao: #5C1A2B; --c-ifood: #EA1D2C; --c-99: #FFC107;
  --s1: #A3284D; --s2: #2A78D6; --s3: #EB6834; --s4: #1BAF7A;
  --pos: #1E7A44; --pos-bg: #E8F5EE; --neg: #B3131F; --neg-bg: #FDECEE; --at: #8A6100; --at-bg: #FFF7DE;
  --info: #2A5F9E; --info-bg: #EAF2FB;
  --sombra: 0 12px 32px rgba(92, 26, 43, 0.08); --sombra-hover: 0 24px 50px rgba(92, 26, 43, 0.18);
  --vidro: rgba(250, 246, 247, 0.88);
  --f-titulo: Montserrat, system-ui, sans-serif; --f-texto: "DM Sans", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-texto); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num, td.n, th.n { font-variant-numeric: tabular-nums; }

/* Barra superior */
.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--vidro);
  backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border-bottom: 1px solid var(--borda); }
@media (prefers-reduced-transparency: reduce) { .topo { background: var(--bg); backdrop-filter: none; } }
.marca { display: flex; align-items: center; gap: 14px; padding-block: 10px; }
.logo { height: 44px; width: auto; flex: none; border-radius: 10px; background: #FFFFFF; padding: 3px; }
.marca-txt { display: flex; flex-direction: column; min-width: 0; }
.marca-txt b { font-family: var(--f-titulo); font-weight: 800; font-size: 18px; color: var(--titulo); line-height: 1.15; }
.marca-txt span { font-size: 13px; color: var(--suave); }
.pilula { margin-left: auto; font-family: var(--f-titulo); font-weight: 700; font-size: 12px; color: var(--neg);
  border: 1px solid #F5C7CC; border-radius: 999px; padding: 7px 12px; white-space: nowrap; background: var(--neg-bg); }
@media (max-width: 600px) { .pilula .longo { display: none; } }
.abas { display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none; }
.abas::-webkit-scrollbar { display: none; }
.abas button { position: relative; min-height: 44px; padding: 0 2px; border: 0; background: none; white-space: nowrap; cursor: pointer;
  font-family: var(--f-titulo); font-weight: 600; font-size: 15px; color: var(--suave); }
.abas button[aria-selected="true"] { color: var(--titulo); font-weight: 800; }
.abas button[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--titulo); }
.selo { margin-left: 6px; font-family: var(--f-texto); font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--at-bg); color: var(--at); }
.filtros { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px; border-top: 1px solid var(--borda); }
.filtros label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--suave); }
select { font: inherit; font-size: 14px; color: var(--ink); background: var(--card); border: 1px solid var(--borda); border-radius: 10px; min-height: 36px; padding: 0 10px; cursor: pointer; max-width: 100%; }
.chk { cursor: pointer; }
.chk input { width: 18px; height: 18px; accent-color: var(--acento); }
button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; border-radius: 6px; }

.seg { display: inline-flex; padding: 4px; gap: 4px; border-radius: 999px; background: var(--tint); flex-wrap: wrap; }
.seg button { min-height: 32px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; cursor: pointer;
  font-family: var(--f-titulo); font-weight: 700; font-size: 13px; color: var(--suave); display: inline-flex; align-items: center; gap: 6px;
  transition: background .2s ease, color .2s ease, transform .1s ease-out; }
.seg button:active { transform: scale(.97); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--titulo); box-shadow: 0 2px 8px rgba(92, 26, 43, .12); }

/* Telas */
main .wrap { padding-block: 28px 48px; }
.tela { display: flex; flex-direction: column; gap: 22px; }
.eyebrow { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--acento); }
.eyebrow::before { content: ""; width: 28px; height: 3px; border-radius: 2px; background: var(--acento); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.manchete { font-family: var(--f-titulo); font-weight: 800; font-size: clamp(24px, 3.2vw, 32px); line-height: 1.15; letter-spacing: -.01em; color: var(--titulo); max-width: 34ch; }
.sub { margin: 0; color: var(--suave); max-width: 75ch; }
h2 { font-family: var(--f-titulo); font-weight: 800; font-size: 19px; color: var(--titulo); }
.cab { display: flex; flex-direction: column; gap: 10px; }
.secao-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.secao-cab small { color: var(--nota); font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--borda); border-radius: 22px; box-shadow: var(--sombra); }
.pad { padding: 22px 24px; }
@media (max-width: 560px) { .pad { padding: 16px; } }
.grade-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 22px; }
.grade-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
@media (max-width: 420px) { .grade-2 { grid-template-columns: 1fr; } }
.grade-2 > *, .grade-4 > * { min-width: 0; }

/* KPI */
.kpi { display: flex; flex-direction: column; gap: 6px; padding: 18px 20px; }
.kpi-rot { font-size: 13px; font-weight: 500; color: var(--suave); }
.kpi-val { font-family: var(--f-titulo); font-weight: 800; font-size: clamp(26px, 3vw, 34px); line-height: 1.05; font-variant-numeric: tabular-nums; color: var(--titulo); }
.kpi-nota { font-size: 12px; color: var(--nota); }
.var { display: inline-flex; align-items: baseline; gap: 6px; font-family: var(--f-titulo); font-weight: 800; font-variant-numeric: tabular-nums; }
.var.pos { color: var(--pos); } .var.neg { color: var(--neg); } .var.zero { color: var(--suave); }
.kpi .var { font-size: clamp(24px, 2.6vw, 30px); }

/* Mix */
.mix-barra { display: flex; height: 14px; border-radius: 8px; overflow: hidden; gap: 2px; }
.mix-barra i { display: block; height: 100%; }
.mini { display: flex; height: 8px; width: 110px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--tint); }
.mini i { display: block; height: 100%; }
.dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; flex: none; }
.legenda { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--suave); }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }

/* Gráficos */
.grafico svg { display: block; width: 100%; height: auto; overflow: visible; }
.eixo { fill: var(--nota); font-size: 11px; font-family: var(--f-texto); }
.rotulo { fill: var(--ink); font-size: 11px; font-family: var(--f-titulo); font-weight: 700; }
.dica { position: fixed; pointer-events: none; z-index: 20; background: var(--card); color: var(--ink); border: 1px solid var(--borda);
  border-radius: 12px; box-shadow: var(--sombra-hover); padding: 10px 12px; font-size: 13px; min-width: 190px; }
.dica b { font-family: var(--f-titulo); color: var(--titulo); }
.dica .l { display: flex; justify-content: space-between; align-items: center; gap: 14px; font-variant-numeric: tabular-nums; }
.dica .l span:first-child { display: inline-flex; align-items: center; gap: 6px; }

/* Tabelas */
.rolar { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: right; padding: 9px 10px; border-bottom: 1px solid var(--borda); white-space: nowrap; font-variant-numeric: tabular-nums; }
th:first-child, td:first-child, th.e, td.e { text-align: left; }
th { font-size: 12px; color: var(--suave); font-weight: 700; vertical-align: bottom; }
th button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
th[aria-sort] button { color: var(--titulo); }
th[aria-sort="descending"] button::after { content: "▼"; font-size: 9px; }
th[aria-sort="ascending"] button::after { content: "▲"; font-size: 9px; }
tbody tr:hover { background: #FDF7F9; }
td.loja { font-weight: 700; color: var(--ink); }
td .chips { display: inline-flex; gap: 4px; margin-left: 8px; vertical-align: middle; }
.chip { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--tint); color: var(--suave); white-space: nowrap; }
.chip.dado { background: var(--at-bg); color: var(--at); }
.chip.nova { background: var(--info-bg); color: var(--info); }
.chip.enc { background: #EEE8EA; color: var(--suave); }
.t-pos { color: var(--pos); font-weight: 700; } .t-neg { color: var(--neg); font-weight: 700; } .t-nd { color: var(--nota); }
.nota-bar { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
.nota-bar i { display: block; height: 6px; border-radius: 3px; background: var(--acento); }
.nota-bar b { font-family: var(--f-titulo); min-width: 26px; text-align: right; }
details.tabela { font-size: 13px; color: var(--suave); margin-top: 14px; }
details.tabela summary { cursor: pointer; font-weight: 700; color: var(--acento); }
details.tabela table { margin-top: 10px; color: var(--ink); }
.cmp input { width: 18px; height: 18px; accent-color: var(--acento); cursor: pointer; }

/* Pesos */
.pesos { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px 22px; }
.peso { display: flex; flex-direction: column; gap: 6px; }
.peso label { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; }
.peso label output { font-family: var(--f-titulo); color: var(--acento); }
.peso input[type=range] { width: 100%; accent-color: var(--acento); min-height: 28px; }
.peso small { font-size: 12px; color: var(--nota); }

/* Variação (quem explica) */
.mov { display: flex; flex-direction: column; gap: 10px; }
.mov-l { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; font-size: 14px; }
.mov-l .b { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--tint); overflow: hidden; }
.mov-l .b i { display: block; height: 100%; border-radius: 4px; }
.mov-l strong { font-variant-numeric: tabular-nums; }

/* Comparação */
.pick { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.pick label { display: flex; align-items: center; gap: 8px; }
.pick select { flex: 1; min-width: 0; }

/* Alertas */
.alertas { display: flex; flex-direction: column; gap: 12px; }
.al { padding: 16px 20px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; }
.al-ic { grid-row: span 3; width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.al h3 { font-family: var(--f-titulo); font-weight: 800; font-size: 16px; color: var(--titulo); }
.al p { margin: 0; font-size: 14px; }
.al .acao { font-size: 13px; color: var(--suave); }
.al.dado .al-ic { background: var(--at-bg); color: var(--at); }
.al.queda .al-ic { background: var(--neg-bg); color: var(--neg); }
.al.alta .al-ic { background: var(--pos-bg); color: var(--pos); }
.al.confirmar .al-ic { background: var(--info-bg); color: var(--info); }
.al.info .al-ic { background: var(--tint); color: var(--titulo); }
.etq { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: 8px; vertical-align: middle; font-family: var(--f-texto); }
.al.dado .etq { background: var(--at-bg); color: var(--at); } .al.queda .etq { background: var(--neg-bg); color: var(--neg); }
.al.alta .etq { background: var(--pos-bg); color: var(--pos); } .al.confirmar .etq { background: var(--info-bg); color: var(--info); }
.al.info .etq { background: var(--tint); color: var(--suave); }
.vazio { padding: 18px 20px; color: var(--suave); font-size: 14px; }
.pendente { padding: 22px 24px; display: flex; gap: 14px; align-items: flex-start; border: 1px dashed var(--nota); border-radius: 22px; background: var(--card); }
.pendente .al-ic { background: var(--tint); color: var(--titulo); flex: none; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
.pendente h3 { font-family: var(--f-titulo); font-weight: 800; font-size: 16px; color: var(--titulo); margin-bottom: 4px; }
.pendente p { margin: 0 0 8px; color: var(--suave); font-size: 14px; max-width: 80ch; }
.pendente code { font-size: 13px; background: var(--tint); padding: 1px 6px; border-radius: 6px; color: var(--ink); }

.link { color: var(--acento); font-weight: 700; background: none; border: 0; padding: 0; cursor: pointer; font: inherit; text-decoration: underline; text-underline-offset: 3px; }
footer { border-top: 1px solid var(--borda); }
footer .wrap { padding-block: 28px 40px; display: flex; gap: 24px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
footer .met { max-width: 85ch; font-size: 12px; color: var(--nota); display: flex; flex-direction: column; gap: 6px; }
footer .met b { color: var(--suave); font-size: 13px; }
footer .logo { height: 34px; }

.entra { animation: entra .6s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes entra { from { opacity: .001; translate: 0 12px; } to { opacity: 1; translate: 0 0; } }
@media (prefers-reduced-motion: reduce) { .entra { animation: none; } }
</style>

<header class="topo">
  <div class="wrap marca">
    <img class="logo" src="__LOGO__" alt="Rede Demo">
    <div class="marca-txt"><b>Portal Gerencial</b><span>Rede Demo</span></div>
    <span class="pilula">Uso interno<span class="longo"> · não enviar a franqueados</span></span>
  </div>
  <div class="wrap"><nav class="abas" role="tablist" aria-label="Telas do portal" id="abas"></nav></div>

<main><div class="wrap" id="conteudo"></div></main>

<div class="dica" id="dica" hidden></div>

<script id="dados" type="application/json">__DADOS_JSON__</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("dados").textContent);
  var M = D.meses, NM = M.length;
  var CANAIS = ["DEGUST", "IFOOD", "99FOOD"];
  var NOME = { DEGUST: "Balcão", IFOOD: "iFood", "99FOOD": "99Food", TODOS: "Todos os canais" };
  var COR = { DEGUST: "var(--c-balcao)", IFOOD: "var(--c-ifood)", "99FOOD": "var(--c-99)" };
  var SERIE = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)"];
  var MESES_PT = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
  var LOJA = {}; D.lojas.forEach(function (l) { LOJA[l.id] = l; });

  /* ---------- Formatação ---------- */
  var fmtR = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
  var fmtR0 = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
  var fmtN = new Intl.NumberFormat("pt-BR");
  function brl(v) { return fmtR.format(v); }
  function brl0(v) { return fmtR0.format(v); }
  function curto(v) {
    var a = Math.abs(v), s = v < 0 ? "−" : "";
    if (a >= 1e6) return s + "R$ " + (a / 1e6).toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + " mi";
    if (a >= 1e3) return s + "R$ " + (a / 1e3).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mil";
    return s + "R$ " + Math.round(a).toLocaleString("pt-BR");
  }
  function pct(v, casas) { return v.toLocaleString("pt-BR", { minimumFractionDigits: casas === undefined ? 1 : casas, maximumFractionDigits: casas === undefined ? 1 : casas }) + "%"; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function rot(ym) { return MESES_PT[+ym.slice(5) - 1].slice(0, 3) + "/" + ym.slice(2, 4); }
  function rotLongo(ym) { return MESES_PT[+ym.slice(5) - 1] + "/" + ym.slice(0, 4); }
  function mesNome(ym) { return MESES_PT[+ym.slice(5) - 1]; }
  function varTxt(v) {
    if (v === null || v === undefined || !isFinite(v)) return '<span class="t-nd">—</span>';
    if (Math.abs(v) < 0.05) return '<span class="t-nd">0,0%</span>';
    return '<span class="' + (v > 0 ? "t-pos" : "t-neg") + '">' + (v > 0 ? "+" : "−") + pct(Math.abs(v)) + "</span>";
  }
  function sinal(v) { return Math.abs(v) < 0.05 ? "estável (" + pct(v, 2).replace("-", "−") + ")" : (v > 0 ? "+" : "−") + pct(Math.abs(v)); }
  function varGrande(v, ref) {
    if (v === null || !isFinite(v)) return '<span class="var zero">Sem base</span><span class="kpi-nota">' + esc(ref) + "</span>";
    if (Math.abs(v) < 0.5) return '<span class="var zero">Estável</span><span class="kpi-nota">' + esc(ref) + "</span>";
    return '<span class="var ' + (v > 0 ? "pos" : "neg") + '">' + (v > 0 ? "▲ +" : "▼ −") + pct(Math.abs(v)) + '</span><span class="kpi-nota">' + esc(ref) + "</span>";
  }

  /* ---------- Estado dos filtros ---------- */
  var S = { i: NM - 1, canal: "TODOS", enc: false, pesos: { fat: 1, mom: 1, yoy: 1, yoy3: 1 },
            ordR: { col: "nota", dir: -1 }, ord9: { col: "pedidos", dir: -1 }, ordP: { col: "fat", dir: -1 }, ordPL: { col: "total", dir: -1 }, cmp: null, aba: "rede" };

  /* ---------- Cálculos ---------- */
  var CI = { DEGUST: 0, IFOOD: 1, "99FOOD": 2 };
  function val(id, k, i) { var a = D.v[id]; return a && i >= 0 && i < NM ? a[k][i] : 0; }
  function chs() { return S.canal === "TODOS" ? [0, 1, 2] : [CI[S.canal]]; }
  // YoY só com balcão + iFood: o 99Food começou em jan/2026 e não tem base no ano anterior
  function chsYoY() { return S.canal === "TODOS" ? [0, 1] : (S.canal === "99FOOD" ? [] : [CI[S.canal]]); }
  function fat(id, i) { return chs().reduce(function (s, k) { return s + val(id, k, i); }, 0); }
  function variacao(a, b) { return b > 0 ? (a / b - 1) * 100 : null; }
  function mom(id, i) { return i < 1 ? null : variacao(fat(id, i), fat(id, i - 1)); }
  // "Mesma base": um canal da loja só entra se vendeu em todos os meses dos dois períodos
  function yoyPar(id, i, n) {
    if (i - 12 - (n - 1) < 0) return null;
    var cur = 0, base = 0, ok = false;
    chsYoY().forEach(function (k) {
      var a = 0, b = 0, falta = false;
      for (var j = 0; j < n; j++) { var x = val(id, k, i - j), y = val(id, k, i - 12 - j); if (!(x > 0 && y > 0)) falta = true; a += x; b += y; }
      if (!falta) { cur += a; base += b; ok = true; }
    });
    return ok ? { cur: cur, base: base } : null;
  }
  function yoy(id, i, n) { var p = yoyPar(id, i, n || 1); return p ? variacao(p.cur, p.base) : null; }
  function redeFat(i, k) { return D.lojas.reduce(function (s, l) { return s + (k === undefined ? fat(l.id, i) : val(l.id, k, i)); }, 0); }

      }
      function pv(d, j) { return j < 0 ? 0 : chs().reduce(function (s, k) { return s + d.v[k][j]; }, 0); }
      function pu(d, j) { return j < 0 ? 0 : chs().reduce(function (s, k) { return s + d.u[k][j]; }, 0); }
      function pyoy(d, j) {
        if (j - 12 < 0) return null;
        var a = 0, b = 0, ok = false;
        chsYoY().forEach(function (k) { if (d.v[k][j] > 0 && d.v[k][j - 12] > 0) { a += d.v[k][j]; b += d.v[k][j - 12]; ok = true; } });
        return ok ? variacao(a, b) : null;
      }
      var totMes = D.produtos.reduce(function (s, d) { return s + pv(d, pi); }, 0);
      var arr = D.produtos.map(function (d, n) { return { n: n, nome: d.nome, cat: d.cat, d: d, fat: pv(d, pi), un: pu(d, pi), mom: variacao(pv(d, pi), pv(d, pi - 1)), yoy: pyoy(d, pi) }; })
        .filter(function (r) { return r.fat > 0; });
      arr.forEach(function (r) { r.part = totMes ? 100 * r.fat / totMes : 0; });
      var lider = arr.slice().sort(function (a, b) { return b.fat - a.fat; })[0];
      var R = rupturasDoMes(i), repet = R.grupos.filter(function (g) { return g.lojas.length >= 2 && !g.sazonal; });
      t.innerHTML = cab("Produtos · " + rotLongo(M[i]) + " · " + NOME[S.canal],
        lider ? lider.nome + " liderou " + mesNome(M[i]) + ", com " + curto(lider.fat) + "." : "Sem vendas de produto neste mês.",
        "Tamanhos somados por família (o iFood mistura tamanhos desde jul/2026). Sem caldas e coberturas, só produtos identificados: " + curto(totMes) + " no mês, " + (redeFat(i) ? pct(100 * totMes / redeFat(i), 0) : "—") + " do faturamento da rede." +
        (R.ok ? " Em " + mesNome(M[i]) + ", <b>" + R.validas + " rupturas</b> em " + R.nLojas + " lojas; " + repet.length + " produtos pararam em 2 ou mais lojas ao mesmo tempo." : "")) +
        '<div class="card pad entra" id="p-rank"></div>' +
        '<div class="grade-2 entra"><div class="card pad" id="p-cat"></div><div class="card pad" id="p-rep"></div></div>' +
        '<div class="card pad entra" id="p-loja"></div>';
      // Ranking de produtos
      var busca = "", mostrarTodos = false;
      var pr = t.querySelector("#p-rank");
      pr.innerHTML = '<div class="secao-cab"><h2>Ranking de produtos</h2><label style="font-size:13px;font-weight:700;color:var(--suave);display:inline-flex;gap:8px;align-items:center">Buscar <input type="search" id="p-busca" style="font:inherit;font-size:14px;min-height:36px;border:1px solid var(--borda);border-radius:10px;padding:0 10px;width:200px" placeholder="ex.: cenoura"></label></div><div id="p-tab"></div>';
      function desenhaRank() {
        var lst = ordenar(arr.filter(function (r) { return !busca || sem(r.nome + " " + r.cat).indexOf(busca) > -1; }), S.ordP);
        var corte = mostrarTodos || busca ? lst : lst.slice(0, 25), pos = {};
        arr.slice().sort(function (a, b) { return b.fat - a.fat; }).forEach(function (r, k) { pos[r.n] = k + 1; });
        var alvo = pr.querySelector("#p-tab"); alvo.innerHTML = "";
        alvo.appendChild(tabelaOrdenavel([{ id: "pos", nome: "#" }, { id: "nome", nome: "Produto", ord: 1, e: 1 }, { id: "cat", nome: "Categoria", e: 1 }, { id: "fat", nome: "Faturamento", ord: 1 }, { id: "un", nome: "Unidades", ord: 1 },
          { id: "mom", nome: "vs mês ant.", ord: 1 }, { id: "yoy", nome: "vs ano ant.", ord: 1 }, { id: "part", nome: "% da rede", ord: 1 }, { id: "mix", nome: "Canais", e: 1 }],
          corte.map(function (r) {
            var m = [0, 1, 2].map(function (k) { return r.d.v[k][pi]; }), tt = m[0] + m[1] + m[2];
            return '<tr><td class="n" style="color:var(--acento);font-weight:800">' + pos[r.n] + '</td><td class="loja e">' + esc(r.nome) + '</td><td class="e" style="color:var(--suave)">' + esc(r.cat) + "</td><td>" + brl0(r.fat) + "</td><td>" + fmtN.format(r.un) + "</td><td>" + varTxt(r.mom) + "</td><td>" + varTxt(r.yoy) + "</td><td>" + pct(r.part) + '</td><td class="e"><span class="mini">' +
              m.map(function (v, k) { return v > 0 ? '<i style="width:' + (100 * v / tt) + "%;background:" + COR[CANAIS[k]] + '"></i>' : ""; }).join("") + "</span></td></tr>";
          }), S.ordP, desenhaRank));
        if (!busca && lst.length > 25) {
          alvo.insertAdjacentHTML("beforeend", '<p style="margin:12px 0 0"><button type="button" class="link" id="p-mais">' + (mostrarTodos ? "Mostrar só os 25 primeiros" : "Mostrar todos os " + lst.length + " produtos") + "</button></p>");
          alvo.querySelector("#p-mais").addEventListener("click", function () { mostrarTodos = !mostrarTodos; desenhaRank(); });
        }
      }
      pr.querySelector("#p-busca").addEventListener("input", function (e) { busca = sem(e.target.value.trim()); desenhaRank(); });
      desenhaRank();
      // Categorias
      var cats = {};
      arr.forEach(function (r) { cats[r.cat] = (cats[r.cat] || 0) + r.fat; });
      var lc = Object.keys(cats).map(function (c) { return { rot: c, v: cats[c] }; }).sort(function (a, b) { return b.v - a.v; }).slice(0, 10);
      var maxC = lc.length ? lc[0].v : 1;
      t.querySelector("#p-cat").innerHTML = '<div class="secao-cab"><h2>Por categoria</h2><small>' + rot(M[i]) + ", 10 maiores</small></div>" +
        '<div class="mov">' + lc.map(function (c) { return '<div class="mov-l"><span>' + esc(c.rot) + "</span><strong>" + curto(c.v) + " · " + pct(100 * c.v / totMes, 0) + '</strong><span class="b"><i style="width:' + (100 * c.v / maxC) + '%;background:var(--acento)"></i></span></div>'; }).join("") + "</div>";
      // Rupturas que se repetem
      var rp = t.querySelector("#p-rep");
      if (!R.ok) {
        rp.innerHTML = '<div class="secao-cab"><h2>Rupturas que se repetem</h2></div><p class="vazio" style="padding:0">' + R.motivo + "</p>";
      } else {
        rp.innerHTML = '<div class="secao-cab"><h2>Rupturas que se repetem</h2><small>Parou em 2 ou mais lojas no mesmo mês</small></div>' +
          (repet.length ? '<div class="mov">' + repet.slice(0, 10).map(function (g) {
            return '<div class="mov-l"><span><b>' + esc(g.nome) + '</b> <span class="chip">' + NOME[g.canal] + "</span></span><strong>" + g.lojas.length + " lojas</strong>" +
              '<span style="grid-column:1/-1;font-size:12px;color:var(--suave)">' + esc(g.lojas.map(function (x) { return LOJA[x.loja].nome; }).join(", ")) + (g.todos === g.lojas.length ? " · parou em todos os canais dessas lojas" : g.todos ? " · " + g.todos + " sem venda em nenhum canal" : "") + "</span></div>";
          }).join("") + "</div>" : '<p class="vazio" style="padding:0">Nenhum produto parou em mais de uma loja.</p>') +
          '<p class="kpi-nota" style="margin:14px 0 0">Quando o mesmo produto para em várias lojas ao mesmo tempo, a causa costuma estar na produção ou no insumo, não na loja.' + (R.ignoradas ? " " + R.ignoradas + " rupturas de lojas com dado a conferir ficaram de fora." : "") + "</p>";
      }
      // Rupturas por loja
      var pl = t.querySelector("#p-loja");
      if (!R.ok) { pl.hidden = true; return; }
      var porLoja = {};
      R.validasLista.forEach(function (x) {
        var o = porLoja[x.loja] || (porLoja[x.loja] = { id: x.loja, nome: LOJA[x.loja].nome, bal: 0, f99: 0, saz: 0, itens: [] });
        if (x.sazonal) o.saz++; else { if (x.canal === "DEGUST") o.bal++; else o.f99++; o.itens.push(x.nome + (x.canal === "DEGUST" ? "" : " (99Food)")); }
      });
      var lojasR = Object.keys(porLoja).map(function (k) { var o = porLoja[k]; o.total = o.bal + o.f99; return o; }).filter(function (o) { return o.total > 0; });
      function desenhaLoja() {
        ordenar(lojasR, S.ordPL);
        pl.innerHTML = '<div class="secao-cab"><h2>Rupturas por loja</h2><small>Vendeu em 2 dos 3 meses anteriores (média ≥ 5 un.) e zerou em ' + rot(M[i]) + ". Balcão por código; 99Food por família. iFood desligado até corrigir o de-para de tamanhos.</small></div>";
        pl.appendChild(tabelaOrdenavel([{ id: "nome", nome: "Loja", ord: 1, e: 1 }, { id: "total", nome: "Rupturas", ord: 1 }, { id: "bal", nome: "Balcão", ord: 1 }, { id: "f99", nome: "99Food", ord: 1 }, { id: "saz", nome: "Sazonais (Arraiá)", ord: 1 }, { id: "itens", nome: "Itens", e: 1 }],
          lojasR.map(function (o) { return '<tr><td class="loja e">' + esc(o.nome) + "</td><td><b>" + o.total + "</b></td><td>" + o.bal + "</td><td>" + o.f99 + "</td><td>" + o.saz + '</td><td class="e" style="white-space:normal;min-width:280px;font-size:13px;color:var(--suave)">' + esc(o.itens.join(", ")) + "</td></tr>"; }), S.ordPL, desenhaLoja));
      }
      desenhaLoja();
    } },

    { id: "invest", nome: "Investimento × retorno", render: function (t) {
      t.innerHTML = cab("Investimento × retorno", "Quanto cada loja investe em cada plataforma e quanto volta.", "") +
        pendente("Aguardando a base de investimento", "<p>Para esta aba, basta uma tabela com uma linha por loja, mês e plataforma:</p><p><code>id_loja</code> · <code>ano_mes</code> · <code>plataforma</code> (IFOOD ou 99FOOD) · <code>tipo</code> (anúncio, cupom, taxa…) · <code>valor_investido</code></p><p>Com ela, o portal calcula o retorno por real investido e o custo do investimento sobre o faturamento do canal, por loja e na rede. Se a plataforma informar as vendas atribuídas ao anúncio, inclua uma coluna <code>vendas_atribuidas</code>: é a medida mais justa de retorno.</p>");
    } }
  ];

  function montaAlertas(i) {
    var A = { dado: [], queda: [], alta: [], conf: [], info: [] };
    D.lojas.filter(function (l) { return l.status === "ativa"; }).forEach(function (l) {
      var ss = suspeitasLoja(l.id, i);
      ss.forEach(function (s) {
        var c = NOME[CANAIS[s.k]];
        A.dado.push({ tipo: "dado", titulo: l.nome + ": " + c + (s.tipo === "zero" ? " sem venda" : " muito abaixo do normal"),
          texto: s.tipo === "zero" ? c + " zerou em " + rotLongo(M[i]) + ", mas vendeu em pelo menos 2 dos 3 meses anteriores (" + ultimaVenda(l.id, s.k, i) + ")." + (s.k === 2 ? " Pode ser também que a loja tenha saído do 99Food." : "")
            : c + " fez " + brl0(val(l.id, s.k, i)) + " em " + rotLongo(M[i]) + ", só " + pct(s.p, 0) + " do normal da loja (mediana dos 12 meses anteriores: " + brl0(s.med) + ").",
          acao: "Conferir a carga com o Téo antes de tirar conclusão sobre a loja." });
      });
      if (ss.length) return;
      var v = mom(l.id, i);
      if (v !== null && fat(l.id, i - 1) > 0 && fat(l.id, i) > 0) {
        if (v <= -20) A.queda.push({ tipo: "queda", titulo: l.nome + ": " + pct(v) + " contra " + mesNome(M[i - 1]), texto: "Faturou " + brl0(fat(l.id, i)) + " em " + rotLongo(M[i]) + " contra " + brl0(fat(l.id, i - 1)) + " no mês anterior. Contra o ano anterior: " + varTxt(yoy(l.id, i, 1)) + ".", acao: "" });
        if (v >= 25) A.alta.push({ tipo: "alta", titulo: l.nome + ": +" + pct(v) + " contra " + mesNome(M[i - 1]), texto: "Faturou " + brl0(fat(l.id, i)) + " em " + rotLongo(M[i]) + " contra " + brl0(fat(l.id, i - 1)) + " no mês anterior. Contra o ano anterior: " + varTxt(yoy(l.id, i, 1)) + ".", acao: "" });
      }
    });
    A.queda.sort(function (a, b) { return parseFloat(a.titulo.split(": ")[1].replace(",", ".")) - parseFloat(b.titulo.split(": ")[1].replace(",", ".")); });
    D.lojas.filter(function (l) { return l.status === "ativa" && fat(l.id, i) === 0 && fat(l.id, i - 1) > 0 && !suspeitasLoja(l.id, i).length; }).forEach(function (l) {
      A.dado.push({ tipo: "dado", titulo: l.nome + ": sem venda em " + rotLongo(M[i]), texto: "A loja está ativa no cadastro e vendeu " + brl0(fat(l.id, i - 1)) + " em " + rot(M[i - 1]) + ", mas não tem venda neste mês.", acao: "Se fechou, pedir ao Téo para marcar ativo = 0." });
    });
    D.notas.forEach(function (n) {
      var a = { tipo: n.tipo, titulo: n.titulo, texto: esc(n.texto), acao: n.acao };
      if (n.tipo === "dado") A.dado.push(a); else if (n.tipo === "confirmar") A.conf.push(a); else A.info.push(a);
    });
    var novas = D.lojas.filter(function (l) { return l.status === "ativa" && fat(l.id, i) > 0 && nova(l, i); });
    if (novas.length) A.info.push({ tipo: "info", titulo: novas.length + " lojas com menos de 1 ano de histórico", texto: novas.map(function (l) { return esc(l.nome) + " (desde " + rot(l.inicio) + ")"; }).join(", ") + ". Ficam sem comparação com o ano anterior e não pesam no YoY da rede.", acao: "" });
    return A;
  }
  function contaAlertas(i) { var A = montaAlertas(i); return A.dado.length + A.queda.length; }

  /* ---------- Filtros ---------- */
  var fm = document.getElementById("f-mes");
  for (var j = NM - 1; j >= 1; j--) fm.insertAdjacentHTML("beforeend", '<option value="' + j + '">' + rotLongo(M[j]) + (j === NM - 1 ? " (último fechado)" : "") + "</option>");
  fm.addEventListener("change", function () { S.i = +fm.value; atualiza(); });
  var fc = document.getElementById("f-canal");
  fc.innerHTML = ["TODOS"].concat(CANAIS).map(function (k) { return '<button type="button" data-c="' + k + '" aria-pressed="' + (k === S.canal) + '">' + (k === "TODOS" ? "" : '<span class="dot" style="background:' + COR[k] + '"></span>') + (k === "TODOS" ? "Todos" : NOME[k]) + "</button>"; }).join("");
  fc.querySelectorAll("button").forEach(function (b) {
    b.addEventListener("click", function () { S.canal = b.dataset.c; fc.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); }); atualiza(); });
  });
  var fe = document.getElementById("f-enc");
  fe.addEventListener("change", function () { S.enc = fe.checked; atualiza(); });

  // Comparação começa com as 3 maiores lojas do mês
  S.cmp = D.lojas.filter(function (l) { return l.status === "ativa"; }).sort(function (a, b) { return fat(b.id, S.i) - fat(a.id, S.i); }).slice(0, 3).map(function (l) { return l.id; });

  /* ---------- Abas ---------- */
  var abas = document.getElementById("abas"), conteudo = document.getElementById("conteudo");
  TELAS.forEach(function (tl) {
    var b = document.createElement("button");
    b.type = "button"; b.setAttribute("role", "tab"); b.id = "aba-" + tl.id; b.dataset.id = tl.id; b.setAttribute("aria-controls", "tela-" + tl.id);
    abas.appendChild(b);
    var sec = document.createElement("section");
    sec.className = "tela"; sec.id = "tela-" + tl.id; sec.setAttribute("role", "tabpanel"); sec.setAttribute("aria-labelledby", b.id); sec.hidden = true;
    conteudo.appendChild(sec);
  });
  function rotulaAbas() {
    TELAS.forEach(function (tl) {
      var n = tl.selo ? tl.selo() : 0;
      document.getElementById("aba-" + tl.id).innerHTML = esc(tl.nome) + (n ? '<span class="selo" aria-label="' + n + ' alertas">' + n + "</span>" : "");
    });
  }
  function abre(id, foco) {
    var tl = TELAS.filter(function (x) { return x.id === id; })[0] || TELAS[0];
    S.aba = tl.id;
    abas.querySelectorAll("button").forEach(function (b) { var on = b.dataset.id === tl.id; b.setAttribute("aria-selected", String(on)); b.tabIndex = on ? 0 : -1; if (on && foco) b.focus(); });
    conteudo.querySelectorAll(".tela").forEach(function (s) { s.hidden = s.id !== "tela-" + tl.id; });
    var sec = document.getElementById("tela-" + tl.id);
    sec.innerHTML = ""; tl.render(sec);
    try { history.replaceState(null, "", "#" + tl.id); } catch (e) {}
    escondeDica();
  }
  function atualiza() { rotulaAbas(); abre(S.aba); }
  abas.addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) abre(b.dataset.id); });
  abas.addEventListener("keydown", function (e) {
    var bs = Array.prototype.slice.call(abas.querySelectorAll("button")), k = bs.indexOf(document.activeElement);
    if (k < 0) return;
    if (e.key === "ArrowRight") { e.preventDefault(); abre(bs[(k + 1) % bs.length].dataset.id, true); }
    if (e.key === "ArrowLeft") { e.preventDefault(); abre(bs[(k - 1 + bs.length) % bs.length].dataset.id, true); }
  });

  document.getElementById("metodo").innerHTML =
    "<b>Como os números foram calculados</b>" +
    "<span>Faturamento oficial: balcão (Degust One, sem os pedidos de aplicativo lançados no caixa) + iFood + 99Food (valor que a loja recebe, só pedidos não cancelados). O total da rede inclui todas as lojas com venda no mês, inclusive as que depois fecharam e as de outra marca da franqueadora, para bater com o relatório oficial da rede.</span>" +
    "<span>“Mesmas lojas”: um canal de uma loja só entra na comparação com o ano anterior se vendeu nos dois períodos. Assim, abertura e fechamento de loja não inflam nem derrubam o crescimento. O 99Food começou em jan/2026 e fica fora do ano a ano.</span>" +
    "<span>Pontos com mais de um id: os ids listados na aba Alertas foram somados num só ponto, por troca de gestão ou por conta nova na plataforma. Loja de teste fora.</span>" +
    "<span>Gerado em " + esc(D.gerado_em) + " com dados até " + esc(rotLongo(D.mes_fechado)) + ". Este arquivo tem o faturamento de todas as lojas: uso interno.</span>";

  rotulaAbas();
  var h = (location.hash || "").replace("#", "");
  abre(TELAS.some(function (x) { return x.id === h; }) ? h : "rede");
})();
</script>
